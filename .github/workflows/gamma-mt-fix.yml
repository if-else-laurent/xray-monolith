# Builds the MT engine (DX11 only) from this branch:
# May 15 2026 MT source (the build shipped with GAMMA 0.9.5) + CFORM async-load fix.
# Based on the build_mt job of msbuild.yml.

name: GAMMA MT fix build

on:
  workflow_dispatch:
  push:
    branches: [ "gamma-may-mt-cform-fix" ]

permissions:
  contents: read

env:
  SOLUTION_FILE_PATH: src/engine-vs2022.sln

jobs:
  build_mt:
    name: build-mt-job
    runs-on: windows-latest

    strategy:
      matrix:
        buildconf: ["DX11"]

    steps:
    - name: Configure Pagefile
      uses: al-cheb/configure-pagefile-action@v1.3
      with:
        minimum-size: 8GB
        maximum-size: 8GB
        disk-root: "C:"

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Init submodules
      uses: snickerbockers/submodules-init@v4

    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v1.3.1
      with:
        msbuild-architecture: "x64"

    - name: Build ${{matrix.buildconf}}
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /p:Configuration=${{matrix.buildconf}} ${{env.SOLUTION_FILE_PATH}}

    - name: Upload Exe
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{matrix.buildconf}}_mt_exe
        path: ./_build/_game/bin_dbg/*.exe
        if-no-files-found: "error"
        retention-days: 7

    - name: Zip PDB
      run: |
        cd ./_build/_game/bin_dbg
        compress-archive -DestinationPath "STALKER-Anomaly-modded-exes_${{matrix.buildconf}}_mt_pdb.zip" -Path "./*.pdb"

    - name: Upload PDB
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{matrix.buildconf}}_mt_pdb
        path: ./_build/_game/bin_dbg/*.zip
        if-no-files-found: "error"
        retention-days: 7
